<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>バイナリ[公式] | Q&amp;A</title>

<link rel="icon" type="image/png" href="243101166.png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
                 "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#f5f7f7;
    color:#222;
}

/* =========================
   HEADER
========================= */

header{
    position:fixed;
    top:0;
    right:0;
    width:100%;
    padding:4px 15px;
    z-index:1000;
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
}

nav{
    width:max-content;
    max-width:calc(100vw - 30px);
    height:58px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    background:#006F68;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.20);
}

nav a{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:0 10px;
    color:#fff;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    transition:.2s;
}

nav a:hover{
    background:rgba(255,255,255,.14);
}

/* =========================
   ICON
========================= */

.icon{
    width:19px;
    height:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.icon svg{
    width:19px;
    height:19px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   MOBILE MENU BUTTON
========================= */

.menu-button{
    display:none;
    position:absolute;
    top:4px;
    right:8px;
    width:50px;
    height:50px;
    border:0;
    border-radius:8px;
    background:#006F68;
    color:#fff;
    cursor:pointer;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:3px;
    box-shadow:0 3px 12px rgba(0,0,0,.20);
}

.hamburger{
    width:21px;
    height:16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.hamburger span{
    width:21px;
    height:2px;
    display:block;
    background:#fff;
    border-radius:2px;
    transition:.25s;
}

.menu-text{
    font-size:8px;
    line-height:8px;
    font-weight:bold;
}

.menu-button.active .hamburger span:nth-child(1){
    transform:translateY(7px) rotate(45deg);
}

.menu-button.active .hamburger span:nth-child(2){
    opacity:0;
}

.menu-button.active .hamburger span:nth-child(3){
    transform:translateY(-7px) rotate(-45deg);
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
    display:none;
    position:absolute;
    top:62px;
    right:8px;
    width:250px;
    padding:5px;
    background:#006F68;
    border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
}

.mobile-menu.active{
    display:block;
}

.mobile-menu a{
    width:100%;
    min-height:47px;
    padding:11px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
    border-radius:5px;
}

.mobile-menu a:hover{
    background:rgba(255,255,255,.14);
}

/* =========================
   MAIN
========================= */

main{
    max-width:1100px;
    margin:0 auto;
    padding:140px 20px 70px;
}

.title{
    font-size:55px;
    color:#006F68;
    margin-bottom:10px;
    font-weight:700;
}

.description{
    font-size:18px;
    color:#555;
    margin-bottom:40px;
}

/* =========================
   LIST
========================= */

.qa-list{
    display:flex;
    flex-direction:column;
}

.qa-item{
    background:#fff;
    padding:20px 22px;
    border-bottom:1px solid #ddd;
    transition:.2s;
}

.qa-item:hover{
    background:#fafdfd;
}

.qa-link{
    display:block;
    color:#222;
    text-decoration:none;
    cursor:pointer;
}

.question{
    font-size:17px;
    font-weight:600;
    line-height:1.6;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.question::before{
    content:"Q.";
    color:#006F68;
    font-weight:700;
    margin-right:8px;
}

.from{
    margin-top:7px;
    color:#555;
    font-size:13px;
}

.from::before{
    content:"From ";
    color:#006F68;
    font-weight:700;
}

.answer-date{
    margin-top:3px;
    color:#888;
    font-size:13px;
}

/* =========================
   DETAIL
========================= */

.detail{
    display:none;
}

.detail.active{
    display:block;
}

.back-button{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-bottom:18px;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    background:#006F68;
    color:#fff;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.back-button:hover{
    opacity:.85;
}

.detail-box{
    background:#fff;
    padding:30px;
    border-radius:16px;
    box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.detail-question{
    font-size:22px;
    font-weight:700;
    line-height:1.7;
    overflow-wrap:anywhere;
}

.detail-question::before{
    content:"Q.";
    color:#006F68;
    margin-right:10px;
}

.detail-from{
    margin-top:10px;
    color:#555;
    font-size:14px;
}

.detail-from::before{
    content:"From ";
    color:#006F68;
    font-weight:700;
}

.detail-date{
    margin-top:4px;
    color:#888;
    font-size:13px;
}

.answer-box{
    margin-top:25px;
    padding-top:22px;
    border-top:1px solid #ddd;
}

.answer{
    font-size:17px;
    line-height:1.9;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.answer::before{
    content:"A.";
    color:#006F68;
    font-weight:700;
    margin-right:10px;
}

/* =========================
   PAGINATION
========================= */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:35px;
}

.pagination button{
    min-width:42px;
    height:42px;
    padding:0 12px;
    border:none;
    border-radius:8px;
    background:#fff;
    color:#006F68;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.pagination button:hover,
.pagination button.active{
    background:#006F68;
    color:#fff;
}

.pagination button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.page-info{
    text-align:center;
    margin-top:14px;
    color:#777;
    font-size:14px;
}

/* =========================
   MESSAGE
========================= */

.message{
    background:#fff;
    padding:35px;
    border-radius:16px;
    text-align:center;
    color:#666;
    line-height:1.8;
}

.error{
    color:#c62828;
}

/* =========================
   FORM
========================= */

.form-box{
    margin-top:45px;
    background:#fff;
    padding:30px;
    border-radius:16px;
    text-align:center;
    box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.form-box h2{
    color:#006F68;
    margin-bottom:12px;
}

.form-box p{
    margin-bottom:20px;
    line-height:1.7;
}

.form-button{
    display:inline-block;
    padding:13px 24px;
    border-radius:9px;
    background:#006F68;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}

.form-button:hover{
    opacity:.85;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:40px;
    color:#777;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    nav a{
        padding:0 7px;
        font-size:11px;
    }

    .icon,
    .icon svg{
        width:17px;
        height:17px;
    }
}

@media(max-width:700px){

    header{
        padding:4px 8px;
    }

    nav{
        display:none;
    }

    .menu-button{
        display:flex;
    }

    main{
        padding:105px 15px 50px;
    }

    .title{
        font-size:42px;
    }

    .description{
        font-size:16px;
        margin-bottom:30px;
    }

    .qa-item{
        padding:18px 8px;
    }

    .question{
        font-size:15px;
    }

    .from{
        font-size:12px;
    }

    .answer-date{
        font-size:12px;
    }

    .detail-box{
        padding:22px 18px;
    }

    .detail-question{
        font-size:18px;
    }

    .answer{
        font-size:16px;
    }

    .pagination{
        gap:5px;
        margin-top:30px;
    }

    .pagination button{
        min-width:38px;
        height:38px;
        padding:0 9px;
        font-size:13px;
    }

    .form-box{
        padding:25px 18px;
    }

    footer{
        padding:30px 20px;
    }
}
</style>

<script>

/* =========================
   MENU
========================= */

const menuButton =
    document.getElementById("menuButton");

const mobileMenu =
    document.getElementById("mobileMenu");


menuButton.addEventListener(
    "click",
    function(){

        mobileMenu.classList.toggle("active");
        menuButton.classList.toggle("active");

        menuButton.setAttribute(
            "aria-expanded",
            mobileMenu.classList.contains("active")
        );

    }
);


mobileMenu.querySelectorAll("a").forEach(
    function(link){

        link.addEventListener(
            "click",
            function(){

                mobileMenu.classList.remove("active");
                menuButton.classList.remove("active");

                menuButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }
        );

    }
);


document.addEventListener(
    "click",
    function(event){

        if(
            !mobileMenu.contains(event.target) &&
            !menuButton.contains(event.target)
        ){

            mobileMenu.classList.remove("active");
            menuButton.classList.remove("active");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


/* =========================
   Q&A SETTINGS
========================= */

/*
 * Q&AのJSONファイル
 */
const QA_JSON_URL = "./qa.json";

/*
 * 1ページに表示する質問数
 *
 * ★ここは5件
 */
const ITEMS_PER_PAGE = 5;


let qaData = [];
let currentPage = 1;


/* =========================
   ELEMENTS
========================= */

const listView =
    document.getElementById("listView");

const detailView =
    document.getElementById("detailView");

const qaList =
    document.getElementById("qaList");

const pagination =
    document.getElementById("pagination");

const pageInfo =
    document.getElementById("pageInfo");

const detailBox =
    document.getElementById("detailBox");

const backButton =
    document.getElementById("backButton");


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   QUESTION
========================= */

function getQuestion(item){

    return (
        item.question ??
        item.Question ??
        item.q ??
        item.Q ??
        item.質問 ??
        item["質問内容"] ??
        ""
    );

}


/* =========================
   ANSWER
========================= */

function getAnswer(item){

    return (
        item.answer ??
        item.Answer ??
        item.a ??
        item.A ??
        item.回答 ??
        item["回答内容"] ??
        ""
    );

}


/* =========================
   FROM
========================= */

function getFrom(item){

    return (
        item.from ??
        item.From ??
        item.FROM ??
        item.sender ??
        item.name ??
        item.user ??
        item.username ??
        item.questioner ??
        item["質問者"] ??
        item["投稿者"] ??
        ""
    );

}


/* =========================
   DATE
========================= */

function getDate(item){

    return (
        item.answerDate ??
        item.answeredAt ??
        item.datetime ??
        item.date ??
        item.timestamp ??
        item.createdAt ??
        item["回答日時"] ??
        item["回答日"] ??
        item["日時"] ??
        ""
    );

}


/* =========================
   DATE VALUE
========================= */

function getDateValue(item){

    const value =
        getDate(item);

    if(!value){
        return 0;
    }

    const time =
        new Date(value).getTime();

    return Number.isNaN(time)
        ? 0
        : time;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(value){

    if(!value){
        return "";
    }

    const date =
        new Date(value);

    if(Number.isNaN(date.getTime())){

        return escapeHTML(
            String(value)
        );

    }

    return (
        date.getFullYear() +
        "." +
        String(
            date.getMonth() + 1
        ).padStart(2,"0") +
        "." +
        String(
            date.getDate()
        ).padStart(2,"0")
    );

}


/* =========================
   SHOW DETAIL
========================= */

function showDetail(index){

    const item =
        qaData[index];

    if(!item){
        return;
    }


    const question =
        getQuestion(item);

    const answer =
        getAnswer(item);

    const from =
        getFrom(item);

    const date =
        getDate(item);


    detailBox.innerHTML = `

        <div class="detail-question">
            ${escapeHTML(question)}
        </div>

        ${
            from
            ? `
            <div class="detail-from">
                ${escapeHTML(from)}
            </div>
            `
            : ""
        }

        <div class="detail-date">
            ${formatDate(date)}
        </div>

        <div class="answer-box">

            <div class="answer">
                ${
                    answer
                    ? escapeHTML(answer)
                    : "回答がまだありません"
                }
            </div>

        </div>

    `;


    listView.style.display =
        "none";

    detailView.classList.add(
        "active"
    );


    /*
     * URLにも質問番号を反映
     */
    history.pushState(
        {
            qaIndex:index
        },
        "",
        "#qa-" + (index + 1)
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   BACK
========================= */

function showList(){

    detailView.classList.remove(
        "active"
    );

    listView.style.display =
        "block";


    history.pushState(
        {},
        "",
        window.location.pathname
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


backButton.addEventListener(
    "click",
    showList
);


/* =========================
   RENDER Q&A LIST
========================= */

function renderQA(){

    qaList.innerHTML = "";
    pagination.innerHTML = "";


    if(qaData.length === 0){

        qaList.innerHTML = `
            <div class="message">
                現在、公開されているQ&amp;Aはありません。
            </div>
        `;

        pageInfo.textContent = "";

        return;

    }


    /*
     * 5件ずつページ分け
     */
    const totalPages =
        Math.ceil(
            qaData.length /
            ITEMS_PER_PAGE
        );


    if(
        currentPage >
        totalPages
    ){

        currentPage =
            totalPages;

    }


    const start =
        (currentPage - 1) *
        ITEMS_PER_PAGE;


    const pageItems =
        qaData.slice(
            start,
            start + ITEMS_PER_PAGE
        );


    pageItems.forEach(
        function(item,index){

            const actualIndex =
                start + index;


            const question =
                getQuestion(item);

            const from =
                getFrom(item);

            const date =
                getDate(item);


            const article =
                document.createElement(
                    "article"
                );

            article.className =
                "qa-item";


            article.innerHTML = `

                <a
                    href="#qa-${actualIndex + 1}"
                    class="qa-link">

                    <div class="question">
                        ${escapeHTML(question)}
                    </div>

                    ${
                        from
                        ? `
                        <div class="from">
                            ${escapeHTML(from)}
                        </div>
                        `
                        : ""
                    }

                    <div class="answer-date">
                        ${formatDate(date)}
                    </div>

                </a>

            `;


            const link =
                article.querySelector(
                    ".qa-link"
                );


            link.addEventListener(
                "click",
                function(event){

                    event.preventDefault();

                    showDetail(
                        actualIndex
                    );

                }
            );


            qaList.appendChild(
                article
            );

        }
    );


    /* =========================
       PAGE INFO
    ========================= */

    pageInfo.textContent =
        currentPage +
        " / " +
        totalPages +
        " ページ";


    /* =========================
       PREVIOUS
    ========================= */

    const prev =
        document.createElement(
            "button"
        );

    prev.type =
        "button";

    prev.textContent =
        "← 前へ";

    prev.disabled =
        currentPage === 1;


    prev.addEventListener(
        "click",
        function(){

            if(
                currentPage <= 1
            ){
                return;
            }

            currentPage--;

            renderQA();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );


    pagination.appendChild(
        prev
    );


    /* =========================
       PAGE NUMBERS
    ========================= */

    for(
        let page = 1;
        page <= totalPages;
        page++
    ){

        const button =
            document.createElement(
                "button"
            );

        button.type =
            "button";

        button.textContent =
            page;


        if(
            page === currentPage
        ){

            button.classList.add(
                "active"
            );

        }


        button.addEventListener(
            "click",
            function(){

                currentPage =
                    page;

                renderQA();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }
        );


        pagination.appendChild(
            button
        );

    }


    /* =========================
       NEXT
    ========================= */

    const next =
        document.createElement(
            "button"
        );

    next.type =
        "button";

    next.textContent =
        "次へ →";

    next.disabled =
        currentPage === totalPages;


    next.addEventListener(
        "click",
        function(){

            if(
                currentPage >=
                totalPages
            ){
                return;
            }

            currentPage++;

            renderQA();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );


    pagination.appendChild(
        next
    );

}


/* =========================
   LOAD JSON
========================= */

async function loadQA(){

    try{

        const response =
            await fetch(
                QA_JSON_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * 配列形式
         */
        if(Array.isArray(data)){

            qaData = data;

        }

        /*
         * {"qa":[...]}形式
         */
        else if(
            data &&
            Array.isArray(data.qa)
        ){

            qaData = data.qa;

        }

        /*
         * {"questions":[...]}形式
         */
        else if(
            data &&
            Array.isArray(data.questions)
        ){

            qaData = data.questions;

        }

        else{

            throw new Error(
                "JSON形式が正しくありません"
            );

        }


        /*
         * 空の質問を除外
         */
        qaData =
            qaData.filter(
                function(item){

                    return (
                        item &&
                        typeof item === "object" &&
                        String(
                            getQuestion(item)
                        ).trim() !== ""
                    );

                }
            );


        /*
         * 新しい日付を上にする
         */
        qaData.sort(
            function(a,b){

                return (
                    getDateValue(b) -
                    getDateValue(a)
                );

            }
        );


        currentPage = 1;

        renderQA();

        /*
         * URLに質問番号がある場合は
         * その質問を直接開く
         */
        openFromHash();

    }
    catch(error){

        console.error(
            "Q&A JSON取得エラー:",
            error
        );


        qaList.innerHTML = `
            <div class="message error">
                Q&amp;Aを読み込めませんでした。<br>
                qa.jsonが正しく配置されているか確認してください。
            </div>
        `;


        pagination.innerHTML = "";

        pageInfo.textContent = "";

    }

}


/* =========================
   HASH
========================= */

function openFromHash(){

    const hash =
        window.location.hash;


    if(
        !hash.startsWith("#qa-")
    ){
        return;
    }


    const number =
        Number(
            hash.replace("#qa-","")
        );


    if(
        !Number.isInteger(number) ||
        number < 1 ||
        number > qaData.length
    ){
        return;
    }


    showDetail(
        number - 1
    );

}


/* =========================
   BROWSER BACK
========================= */

window.addEventListener(
    "popstate",
    function(){

        if(
            window.location.hash.startsWith(
                "#qa-"
            )
        ){

            openFromHash();

        }
        else{

            detailView.classList.remove(
                "active"
            );

            listView.style.display =
                "block";

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    }
);


/* =========================
   START
========================= */

loadQA();


/*
 * 30秒ごとにJSONを再取得
 */
setInterval(
    loadQA,
    30000
);

</script>
