<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>バイナリ[公式] | Q&amp;A</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f7f7;
    color:#222;
}

/* =========================
   HEADER / NAV
========================= */

header{
    position:fixed;
    top:0;
    right:0;
    width:100%;
    padding:4px 15px;
    z-index:1000;
    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
}

nav{
    width:max-content;
    max-width:calc(100vw - 30px);
    height:58px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    background:#006F68;
    padding:0;
    margin:0;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 3px 12px rgba(0,0,0,.20);
}

nav a{
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:0 10px;
    color:white;
    text-decoration:none;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    transition:.2s;
}

nav a:hover{
    background:rgba(255,255,255,.14);
}

/* =========================
   ICON
========================= */

.icon{
    width:19px;
    height:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.icon svg{
    width:19px;
    height:19px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
}

/* =========================
   MOBILE MENU BUTTON
========================= */

.menu-button{
    display:none;
    position:absolute;
    top:4px;
    right:15px;
    width:50px;
    height:50px;
    border:0;
    border-radius:8px;
    background:#006F68;
    color:white;
    cursor:pointer;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:3px;
    box-shadow:0 3px 12px rgba(0,0,0,.20);
}

.hamburger{
    width:21px;
    height:16px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.hamburger span{
    width:21px;
    height:2px;
    display:block;
    background:white;
    border-radius:2px;
    transition:.25s;
}

.menu-text{
    font-size:8px;
    line-height:8px;
    font-weight:bold;
}

.menu-button.active .hamburger span:nth-child(1){
    transform:translateY(7px) rotate(45deg);
}

.menu-button.active .hamburger span:nth-child(2){
    opacity:0;
}

.menu-button.active .hamburger span:nth-child(3){
    transform:translateY(-7px) rotate(-45deg);
}

/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
    display:none;
    position:absolute;
    top:62px;
    right:15px;
    width:250px;
    padding:5px;
    background:#006F68;
    border-radius:8px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
}

.mobile-menu.active{
    display:block;
}

.mobile-menu a{
    width:100%;
    min-height:47px;
    padding:11px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:bold;
    border-radius:5px;
}

.mobile-menu a:hover{
    background:rgba(255,255,255,.14);
}

/* =========================
   MAIN
========================= */

main{
    max-width:1100px;
    margin:0 auto;
    padding:140px 20px 70px;
}

.title{
    font-size:55px;
    color:#006F68;
    margin-bottom:10px;
    font-weight:700;
}

.description{
    font-size:18px;
    color:#555;
    margin-bottom:40px;
}

/* =========================
   Q&A LIST
========================= */

.qa-list{
    display:flex;
    flex-direction:column;
    gap:0;
}

/* 1件のQ&A */

.qa-item{
    background:white;
    padding:18px 5px;
    border-bottom:1px solid #ddd;
    box-shadow:none;
    border-radius:0;
}

/* 質問リンク */

.qa-link{
    display:block;
    color:#222;
    text-decoration:none;
    cursor:pointer;
}

.qa-link:hover .question{
    color:#006F68;
}

/* 質問 */

.question{
    color:#222;
    font-size:16px;
    font-weight:400;
    line-height:1.6;
    margin-bottom:6px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

    transition:.2s;
}

.question::before{
    content:"";
    margin-right:0;
}

/* 日付 */

.answer-date{
    margin:0;
    padding:0;
    border:0;
    color:#777;
    font-size:14px;
    font-weight:bold;
}

/* =========================
   回答表示
========================= */

.answer-area{
    display:none;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid #e5e5e5;
}

.qa-item.open .answer-area{
    display:block;
}

.answer{
    font-size:17px;
    line-height:1.8;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.answer::before{
    content:"A.";
    color:#006F68;
    font-weight:700;
    margin-right:8px;
}

/* =========================
   MESSAGE
========================= */

.message{
    background:white;
    padding:35px;
    border-radius:18px;
    text-align:center;
    color:#666;
    line-height:1.8;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
}

.error{
    color:#c62828;
}

/* =========================
   PAGINATION
========================= */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:40px;
}

.pagination button{
    min-width:42px;
    height:42px;
    padding:0 12px;
    border:none;
    border-radius:8px;
    background:white;
    color:#006F68;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    transition:.2s;
}

.pagination button:hover{
    background:#006F68;
    color:white;
}

.pagination button.active{
    background:#006F68;
    color:white;
}

.pagination button:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.page-info{
    text-align:center;
    margin-top:15px;
    color:#777;
    font-size:14px;
}

/* =========================
   QUESTION FORM
========================= */

.form-box{
    margin-top:45px;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
    text-align:center;
}

.form-box h2{
    color:#006F68;
    margin-bottom:12px;
}

.form-box p{
    line-height:1.7;
    margin-bottom:20px;
}

.form-button{
    display:inline-block;
    padding:13px 24px;
    border-radius:9px;
    background:#006F68;
    color:white;
    text-decoration:none;
    font-weight:bold;
    transition:.2s;
}

.form-button:hover{
    opacity:.85;
}

/* =========================
   FOOTER
========================= */

footer{
    text-align:center;
    padding:40px;
    color:#777;
}

/* =========================
   TABLET
========================= */

@media(max-width:1100px){

    nav a{
        padding:0 7px;
        font-size:11px;
    }

    .icon,
    .icon svg{
        width:17px;
        height:17px;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        padding:4px 8px;
    }

    nav{
        display:none;
    }

    .menu-button{
        display:flex;
        right:8px;
    }

    .mobile-menu{
        top:62px;
        right:8px;
    }

    main{
        padding:105px 15px 50px;
    }

    .title{
        font-size:42px;
        margin-bottom:10px;
    }

    .description{
        font-size:16px;
        margin-bottom:30px;
    }

    .qa-item{
        padding:18px 5px;
    }

    .question{
        font-size:15px;
    }

    .answer{
        font-size:16px;
    }

    .answer-date{
        font-size:13px;
    }

    .pagination{
        gap:5px;
        margin-top:30px;
    }

    .pagination button{
        min-width:38px;
        height:38px;
        padding:0 9px;
        font-size:13px;
    }

    .form-box{
        padding:25px 18px;
        border-radius:16px;
    }

    footer{
        padding:30px 20px;
    }
}

</style>

</head>

<script>

/* =========================
   MENU
========================= */

const menuButton =
    document.getElementById("menuButton");

const mobileMenu =
    document.getElementById("mobileMenu");


menuButton.addEventListener("click",function(){

    mobileMenu.classList.toggle("active");
    menuButton.classList.toggle("active");

    const isOpen =
        mobileMenu.classList.contains("active");

    menuButton.setAttribute(
        "aria-expanded",
        isOpen
    );

});


mobileMenu.querySelectorAll("a").forEach(function(link){

    link.addEventListener("click",function(){

        mobileMenu.classList.remove("active");
        menuButton.classList.remove("active");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    });

});


document.addEventListener("click",function(event){

    if(
        !mobileMenu.contains(event.target) &&
        !menuButton.contains(event.target)
    ){

        mobileMenu.classList.remove("active");
        menuButton.classList.remove("active");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    }

});


/* =========================
   Q&A
========================= */

const QA_JSON_URL = "./qa.json";

/*
 * 1ページにつき1件
 */
const ITEMS_PER_PAGE = 1;

let qaData = [];

let currentPage = 1;


/* =========================
   HTML ESCAPE
========================= */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   QUESTION
========================= */

function getQuestion(item){

    return (
        item.question ??
        item.Question ??
        item.q ??
        item.Q ??
        item.質問 ??
        item["質問内容"] ??
        ""
    );

}


/* =========================
   ANSWER
========================= */

function getAnswer(item){

    return (
        item.answer ??
        item.Answer ??
        item.a ??
        item.A ??
        item.回答 ??
        item["回答内容"] ??
        ""
    );

}


/* =========================
   DATE
========================= */

function getDate(item){

    return (
        item.questionDate ??
        item.createdAt ??
        item.timestamp ??
        item.datetime ??
        item.date ??
        item.answerDate ??
        item.answeredAt ??
        item["質問日時"] ??
        item["回答日時"] ??
        item["回答日"] ??
        item["日時"] ??
        ""
    );

}


/* =========================
   DATE VALUE
========================= */

function getDateValue(item){

    const value =
        getDate(item);

    if(!value){
        return 0;
    }

    const time =
        new Date(value).getTime();

    return Number.isNaN(time)
        ? 0
        : time;

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(value){

    if(!value){
        return "";
    }

    const date =
        new Date(value);

    if(Number.isNaN(date.getTime())){

        return escapeHTML(
            String(value)
        );

    }

    return (
        date.getFullYear() +
        "." +
        String(
            date.getMonth() + 1
        ).padStart(2,"0") +
        "." +
        String(
            date.getDate()
        ).padStart(2,"0")
    );

}


/* =========================
   LOAD JSON
========================= */

async function loadQA(){

    const list =
        document.getElementById("qaList");

    list.innerHTML = `
        <div class="message">
            Q&amp;Aを読み込んでいます…
        </div>
    `;

    try{

        const response =
            await fetch(
                QA_JSON_URL +
                "?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * 配列形式
         */
        if(Array.isArray(data)){

            qaData = data;

        }

        /*
         * {"qa":[...]}
         */
        else if(
            data &&
            Array.isArray(data.qa)
        ){

            qaData = data.qa;

        }

        /*
         * {"questions":[...]}
         */
        else if(
            data &&
            Array.isArray(data.questions)
        ){

            qaData = data.questions;

        }

        else{

            throw new Error(
                "JSONの形式が正しくありません"
            );

        }


        /*
         * 空の質問を除外
         */

        qaData =
            qaData.filter(function(item){

                return (
                    item &&
                    typeof item === "object" &&
                    String(
                        getQuestion(item)
                    ).trim() !== ""
                );

            });


        /*
         * 新しい順
         */

        qaData.sort(function(a,b){

            return (
                getDateValue(b) -
                getDateValue(a)
            );

        });


        currentPage = 1;

        renderQA();

    }

    catch(error){

        console.error(
            "Q&A JSON取得エラー:",
            error
        );

        list.innerHTML = `
            <div class="message error">
                Q&amp;Aを読み込めませんでした。<br>
                JSONファイルが正しく配置されているか確認してください。
            </div>
        `;

        document.getElementById(
            "pagination"
        ).innerHTML = "";

        document.getElementById(
            "pageInfo"
        ).textContent = "";

    }

}


/* =========================
   RENDER
========================= */

function renderQA(){

    const list =
        document.getElementById("qaList");

    const pagination =
        document.getElementById("pagination");

    const pageInfo =
        document.getElementById("pageInfo");


    list.innerHTML = "";

    pagination.innerHTML = "";


    if(qaData.length === 0){

        list.innerHTML = `
            <div class="message">
                現在、公開されているQ&amp;Aはありません。
            </div>
        `;

        pageInfo.textContent = "";

        return;

    }


    /*
     * 1ページ = 1件
     */

    const totalPages =
        qaData.length;


    if(currentPage > totalPages){

        currentPage =
            totalPages;

    }


    const item =
        qaData[currentPage - 1];


    if(!item){
        return;
    }


    const question =
        getQuestion(item);

    const answer =
        getAnswer(item);

    const date =
        getDate(item);


    /* =========================
       Q&A ITEM
    ========================= */

    const article =
        document.createElement("article");

    article.className =
        "qa-item";


    article.innerHTML = `

        <a
            href="javascript:void(0)"
            class="qa-link"
            aria-expanded="false">

            <div class="question">
                ${escapeHTML(question)}
            </div>

            <div class="answer-date">
                ${formatDate(date)}
            </div>

        </a>

        <div class="answer-area">

            <div class="answer">
                ${
                    answer
                    ? escapeHTML(answer)
                    : "回答がまだありません"
                }
            </div>

        </div>

    `;


    /* =========================
       CLICK
    ========================= */

    const link =
        article.querySelector(
            ".qa-link"
        );


    link.addEventListener(
        "click",
        function(){

            const isOpen =
                article.classList.toggle(
                    "open"
                );

            link.setAttribute(
                "aria-expanded",
                isOpen
            );

        }
    );


    list.appendChild(article);


    /* =========================
       PAGE INFO
    ========================= */

    pageInfo.textContent =
        currentPage +
        " / " +
        totalPages +
        " ページ";


    /* =========================
       PREVIOUS
    ========================= */

    const prev =
        document.createElement("button");

    prev.textContent =
        "← 前へ";

    prev.disabled =
        currentPage === 1;


    prev.addEventListener(
        "click",
        function(){

            if(currentPage <= 1){
                return;
            }

            currentPage--;

            renderQA();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );


    pagination.appendChild(
        prev
    );


    /* =========================
       PAGE NUMBERS
    ========================= */

    for(
        let page = 1;
        page <= totalPages;
        page++
    ){

        const button =
            document.createElement(
                "button"
            );


        button.textContent =
            page;


        if(
            page ===
            currentPage
        ){

            button.classList.add(
                "active"
            );

        }


        button.addEventListener(
            "click",
            function(){

                currentPage =
                    page;

                renderQA();

                window.scrollTo({
                    top:0,
                    behavior:"smooth"
                });

            }
        );


        pagination.appendChild(
            button
        );

    }


    /* =========================
       NEXT
    ========================= */

    const next =
        document.createElement("button");

    next.textContent =
        "次へ →";

    next.disabled =
        currentPage === totalPages;


    next.addEventListener(
        "click",
        function(){

            if(
                currentPage >=
                totalPages
            ){
                return;
            }

            currentPage++;

            renderQA();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );


    pagination.appendChild(
        next
    );

}


/* =========================
   START
========================= */

loadQA();


/*
 * 30秒ごとにJSONを再取得
 */

setInterval(
    loadQA,
    30000
);

</script>


</body>
</html>
