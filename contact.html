<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        "Noto Sans JP",
        sans-serif;

    background:#f5f7f7;
    color:#222;
}


/* =========================
   HEADER / NAV
========================= */

header{
    position:fixed;
    top:0;
    right:0;
    width:100%;

    padding:4px 15px;

    z-index:1000;

    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
}

nav{
    width:max-content;
    max-width:calc(100vw - 30px);
    height:58px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    background:#006F68;

    padding:0;
    margin:0;

    border-radius:8px;
    overflow:hidden;

    box-shadow:0 3px 12px rgba(0,0,0,.20);
}

nav a{
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:6px;

    padding:0 10px;

    color:white;
    text-decoration:none;

    font-size:13px;
    font-weight:bold;

    white-space:nowrap;

    transition:
        background .2s ease,
        transform .2s ease;
}

nav a:hover{
    background:rgba(255,255,255,.14);
}

nav a:active{
    transform:scale(.97);
}

nav a.current{
    background:rgba(255,255,255,.18);
}


/* =========================
   ICON
========================= */

.icon{
    width:19px;
    height:19px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.icon svg{
    width:19px;
    height:19px;

    fill:none;
    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================
   MOBILE MENU BUTTON
========================= */

.menu-button{
    display:none;

    position:absolute;
    top:4px;
    right:15px;

    width:50px;
    height:50px;

    border:0;
    border-radius:8px;

    background:#006F68;
    color:white;

    cursor:pointer;

    align-items:center;
    justify-content:center;

    flex-direction:column;
    gap:3px;

    box-shadow:0 3px 12px rgba(0,0,0,.20);

    -webkit-tap-highlight-color:transparent;
}

.hamburger{
    width:21px;
    height:16px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.hamburger span{
    width:21px;
    height:2px;

    display:block;

    background:white;

    border-radius:2px;

    transition:
        transform .25s ease,
        opacity .2s ease;
}

.menu-text{
    font-size:8px;
    line-height:8px;
    font-weight:bold;
}

.menu-button.active .hamburger span:nth-child(1){
    transform:translateY(7px) rotate(45deg);
}

.menu-button.active .hamburger span:nth-child(2){
    opacity:0;
}

.menu-button.active .hamburger span:nth-child(3){
    transform:translateY(-7px) rotate(-45deg);
}


/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
    display:none;

    position:absolute;
    top:62px;
    right:15px;

    width:250px;
    padding:5px;

    background:#006F68;

    border-radius:8px;

    box-shadow:0 6px 20px rgba(0,0,0,.25);

    transform-origin:top right;
}

.mobile-menu.active{
    display:block;
    animation:menuOpen .2s ease;
}

.mobile-menu a{
    width:100%;
    min-height:47px;

    padding:11px 14px;

    display:flex;
    align-items:center;

    gap:12px;

    color:white;
    text-decoration:none;

    font-size:14px;
    font-weight:bold;

    border-radius:5px;

    transition:background .2s ease;
}

.mobile-menu a:hover{
    background:rgba(255,255,255,.14);
}

.mobile-menu a.current{
    background:rgba(255,255,255,.18);
}


@keyframes menuOpen{

    from{
        opacity:0;
        transform:translateY(-5px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}


/* =========================
   MAIN
========================= */

main{
    max-width:1100px;

    margin:0 auto;

    padding:140px 20px 70px;
}

.title{
    font-size:55px;

    font-weight:800;

    color:#006F68;

    margin-bottom:15px;

    letter-spacing:2px;
}

.description{
    font-size:18px;

    margin-bottom:40px;

    color:#555;

    line-height:1.7;
}


/* =========================
   CONTACT BOX
========================= */

.contact-box{
    background:#fff;

    border-radius:20px;

    padding:35px;

    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.contact-box h2{
    color:#006F68;

    font-size:28px;

    margin-bottom:15px;

    line-height:1.5;
}

.contact-box p{
    color:#555;

    font-size:16px;

    line-height:1.8;

    margin-bottom:10px;
}

.contact-box h4{
    color:#d97706;

    font-size:14px;

    line-height:1.7;

    margin-bottom:25px;
}


/* =========================
   GOOGLE FORM
========================= */

.form-wrapper{
    width:100%;

    overflow:hidden;

    border-radius:12px;

    background:#fff;
}

.form{
    display:block;

    width:100%;

    height:1500px;

    min-height:1500px;

    border:0;

    margin:0;

    padding:0;

    background:#fff;
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    padding:40px;

    color:#777;

    font-size:14px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    nav a{
        padding:0 7px;
        font-size:11px;
    }

    .icon,
    .icon svg{
        width:17px;
        height:17px;
    }

}


@media(max-width:700px){

    header{
        padding:4px 8px;
    }

    nav{
        display:none;
    }

    .menu-button{
        display:flex;
        right:8px;
    }

    .mobile-menu{
        top:62px;
        right:8px;

        width:250px;

        max-width:calc(100vw - 16px);
    }

    main{
        padding:105px 15px 50px;
    }

    .title{
        font-size:42px;

        margin-bottom:10px;
    }

    .description{
        font-size:16px;

        margin-bottom:30px;
    }

    .contact-box{
        padding:25px 20px;

        border-radius:16px;
    }

    .contact-box h2{
        font-size:23px;
    }

    .contact-box p{
        font-size:15px;
    }

    .contact-box h4{
        font-size:13px;

        margin-bottom:20px;
    }


    /* =========================
       MOBILE GOOGLE FORM
    ========================= */

    .form-wrapper{
        width:calc(100% + 10px);

        margin-left:-5px;
    }

    .form{
        width:100%;

        height:1650px;

        min-height:1650px;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

    .mobile-menu{
        width:calc(100vw - 16px);
    }

    .title{
        font-size:36px;
    }

    .contact-box{
        padding:22px 16px;
    }

    .form-wrapper{
        width:calc(100% + 8px);

        margin-left:-4px;
    }

    .form{
        height:1750px;

        min-height:1750px;
    }

}

========================= -->

<iframe
    class="form"
    src="https://docs.google.com/forms/d/e/1FAIpQLSdBnkiE4LR3LHIt72-LibEUVVjJISLXa2_IbmGOtWML3My13w/viewform?embedded=true"

<script>

const menuButton =
    document.getElementById("menuButton");

const mobileMenu =
    document.getElementById("mobileMenu");


/* =========================
   MENU OPEN / CLOSE
========================= */

menuButton.addEventListener("click", function(){

    mobileMenu.classList.toggle("active");

    menuButton.classList.toggle("active");

    const isOpen =
        mobileMenu.classList.contains("active");

    menuButton.setAttribute(
        "aria-expanded",
        isOpen ? "true" : "false"
    );

});


/* =========================
   CLOSE AFTER LINK CLICK
========================= */

mobileMenu
    .querySelectorAll("a")
    .forEach(function(link){

        link.addEventListener("click", function(){

            mobileMenu.classList.remove("active");

            menuButton.classList.remove("active");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        });

    });


/* =========================
   CLOSE WHEN CLICKING OUTSIDE
========================= */

document.addEventListener("click", function(event){

    if(
        !mobileMenu.contains(event.target) &&
        !menuButton.contains(event.target)
    ){

        mobileMenu.classList.remove("active");

        menuButton.classList.remove("active");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    }

});


/* =========================
   ESC KEY
========================= */

document.addEventListener("keydown", function(event){

    if(event.key === "Escape"){

        mobileMenu.classList.remove("active");

        menuButton.classList.remove("active");

        menuButton.setAttribute(
            "aria-expanded",
            "false"
        );

    }

});

</script>



<!-- ACCESS RECORD NOTICE -->
<div class="access-consent" id="accessConsent">
    <div class="access-consent-text">
        このサイトでは、アクセス日時・ページURL・端末・OS・ブラウザ等のアクセス情報を記録しています。
    </div>
    <button type="button" id="accessConsentButton" aria-label="アクセス記録のお知らせを閉じる">OK</button>
</div>


<script>
/* =========================
   ACCESS RECORD + NOTICE
   ========================= */
(function(){
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSccfR4g1Ytnzr0aLv31R3NkjUWRmaaD6YwQnjNYF0d60Uexmg/formResponse";

    function getDevice(){
        const w=window.innerWidth;
        if(w<=700) return "スマートフォン";
        if(w<=1100) return "タブレット";
        return "PC";
    }
    function getOS(){
        const ua=navigator.userAgent;
        if(/Android/i.test(ua)) return "Android";
        if(/iPhone|iPad|iPod/i.test(ua)) return "iOS / iPadOS";
        if(/Windows/i.test(ua)) return "Windows";
        if(/Mac OS X/i.test(ua)) return "macOS";
        if(/CrOS/i.test(ua)) return "ChromeOS";
        if(/Linux/i.test(ua)) return "Linux";
        return "その他 / 不明";
    }
    function getBrowser(){
        const ua=navigator.userAgent;
        if(/Edg\//i.test(ua)) return "Microsoft Edge";
        if(/OPR\//i.test(ua)) return "Opera";
        if(/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) return "Google Chrome";
        if(/Firefox\//i.test(ua)) return "Firefox";
        if(/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) return "Safari";
        return "その他 / 不明";
    }

    function sendAccessLog(){
        const now=new Date();
        const params=new URLSearchParams();
        params.set("entry.1390942320", now.toLocaleString("ja-JP", {timeZone:"Asia/Tokyo"}));
        params.set("entry.600562719", location.href);
        params.set("entry.32786128", document.title);
        params.set("entry.318452337", getDevice());
        params.set("entry.1152326462", getOS());
        params.set("entry.777710718", getBrowser());

        // Hidden iframe + form submit: Google Formsの送信を確実に行う
        const iframe=document.createElement("iframe");
        iframe.name="accessLogFrame_"+Date.now();
        iframe.style.display="none";
        document.body.appendChild(iframe);

        const form=document.createElement("form");
        form.method="GET";
        form.action=FORM_URL;
        form.target=iframe.name;
        form.style.display="none";

        params.forEach((value,key)=>{
            const input=document.createElement("input");
            input.type="hidden";
            input.name=key;
            input.value=value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
    }

    function setupNotice(){
        const notice=document.getElementById("accessConsent");
        const button=document.getElementById("accessConsentButton");
        if(!notice || !button) return;
        button.addEventListener("click", function(e){
            e.preventDefault();
            e.stopPropagation();
            notice.remove();
            try{ sessionStorage.setItem("accessNoticeAccepted","1"); }catch(e){}
        });
        try{
            if(sessionStorage.getItem("accessNoticeAccepted")==="1") notice.remove();
        }catch(e){}
    }

    function start(){
        setupNotice();
        sendAccessLog();
    }
    if(document.readyState==="loading"){
        document.addEventListener("DOMContentLoaded", start, {once:true});
    }else{
        start();
    }
})();
</script>
