<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        "Noto Sans JP",
        sans-serif;

    background:#f5f7f7;
    color:#222;
}


/* =========================
   HEADER / NAV
========================= */

header{
    position:fixed;
    top:0;
    right:0;
    width:100%;

    padding:4px 15px;

    z-index:1000;

    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
}

nav{
    width:max-content;
    max-width:calc(100vw - 30px);
    height:58px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    background:#006F68;

    padding:0;
    margin:0;

    border-radius:8px;
    overflow:hidden;

    box-shadow:0 3px 12px rgba(0,0,0,.20);
}

nav a{
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:6px;

    padding:0 10px;

    color:white;
    text-decoration:none;

    font-size:13px;
    font-weight:bold;

    white-space:nowrap;

    transition:.2s;
}

nav a:hover{
    background:rgba(255,255,255,.14);
}


/* =========================
   ICON
========================= */

.icon{
    width:19px;
    height:19px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.icon svg{
    width:19px;
    height:19px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================
   MOBILE MENU BUTTON
========================= */

.menu-button{
    display:none;

    position:absolute;

    top:4px;
    right:15px;

    width:50px;
    height:50px;

    border:0;
    border-radius:8px;

    background:#006F68;
    color:white;

    cursor:pointer;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:3px;

    box-shadow:0 3px 12px rgba(0,0,0,.20);
}

.hamburger{
    width:21px;
    height:16px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;
}

.hamburger span{
    width:21px;
    height:2px;

    display:block;

    background:white;

    border-radius:2px;

    transition:.25s;
}

.menu-text{
    font-size:8px;
    line-height:8px;
    font-weight:bold;
}


.menu-button.active .hamburger span:nth-child(1){
    transform:translateY(7px) rotate(45deg);
}

.menu-button.active .hamburger span:nth-child(2){
    opacity:0;
}

.menu-button.active .hamburger span:nth-child(3){
    transform:translateY(-7px) rotate(-45deg);
}


/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
    display:none;

    position:absolute;

    top:62px;
    right:15px;

    width:250px;

    padding:5px;

    background:#006F68;

    border-radius:8px;

    box-shadow:0 6px 20px rgba(0,0,0,.25);
}

.mobile-menu.active{
    display:block;
}

.mobile-menu a{
    width:100%;
    min-height:47px;

    padding:11px 14px;

    display:flex;
    align-items:center;

    gap:12px;

    color:white;
    text-decoration:none;

    font-size:14px;
    font-weight:bold;

    border-radius:5px;
}

.mobile-menu a:hover{
    background:rgba(255,255,255,.14);
}


/* =========================
   MAIN
========================= */

main{
    max-width:1100px;

    margin:0 auto;

    padding:140px 20px 70px;
}

.title{
    font-size:55px;

    font-weight:800;

    color:#006F68;

    margin-bottom:40px;

    letter-spacing:2px;
}


/* =========================
   DOCUMENT
========================= */

.document{
    background:white;

    padding:35px;

    border-radius:20px;

    margin-bottom:25px;

    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.document h2{
    color:#006F68;

    font-size:28px;

    margin-bottom:15px;
}

.document p{
    font-size:18px;

    line-height:1.8;

    margin-bottom:15px;
}


/* =========================
   PDF BUTTON
========================= */

.pdf-button{
    display:inline-block;

    margin-top:20px;

    background:#079C94;

    color:white;

    padding:12px 35px;

    border-radius:25px;

    text-decoration:none;

    font-weight:bold;

    transition:.2s;
}

.pdf-button:hover{
    background:#006F68;
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    padding:40px;

    color:#777;

    font-size:14px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

    nav a{
        padding:0 7px;
        font-size:11px;
    }

    .icon,
    .icon svg{
        width:17px;
        height:17px;
    }

}


@media(max-width:700px){

    header{
        padding:4px 8px;
    }

    nav{
        display:none;
    }

    .menu-button{
        display:flex;
        right:8px;
    }

    .mobile-menu{
        top:62px;
        right:8px;
    }

    main{
        padding:105px 15px 50px;
    }

    .title{
        font-size:42px;

        margin-bottom:30px;
    }

    .document{
        padding:25px 20px;

        border-radius:16px;
    }

    .document h2{
        font-size:24px;
    }

    .document p{
        font-size:16px;
    }

}

</style>

</head>

<script>

const menuButton =
document.getElementById("menuButton");

const mobileMenu =
document.getElementById("mobileMenu");


menuButton.addEventListener("click",function(){

mobileMenu.classList.toggle("active");

menuButton.classList.toggle("active");

const isOpen =
mobileMenu.classList.contains("active");

menuButton.setAttribute(
"aria-expanded",
isOpen
);

});


mobileMenu
.querySelectorAll("a")
.forEach(function(link){

link.addEventListener("click",function(){

mobileMenu.classList.remove("active");

menuButton.classList.remove("active");

menuButton.setAttribute(
"aria-expanded",
"false"
);

});

});


document.addEventListener("click",function(event){

if(
!mobileMenu.contains(event.target) &&
!menuButton.contains(event.target)
){

mobileMenu.classList.remove("active");

menuButton.classList.remove("active");

menuButton.setAttribute(
"aria-expanded",
"false"
);

}

});

</script>
