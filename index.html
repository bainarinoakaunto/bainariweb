*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",sans-serif;
    color:white;
}


/* ナビ */

header{
    position:absolute;
    top:0;
    width:100%;
    padding:25px;
    z-index:10;
}


nav{
    max-width:1200px;
    margin:auto;
}


nav a{
    color:white;
    text-decoration:none;
    margin-right:25px;
    font-weight:bold;
}



/* メイン */

.hero{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    position:relative;

    overflow:hidden;

}



/* 背景動画 */

.bg-video{

    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    top:0;
    left:0;

    z-index:-2;

}



/* 暗いフィルター */

.hero::before{

    content:"";

    position:absolute;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.45);

    z-index:-1;

}



/* 文字 */

.content h1{

    font-size:80px;

    letter-spacing:10px;

}


.content p{

    font-size:22px;

    margin-top:20px;

}



/* ボタン */

.button{

    display:inline-block;

    margin-top:40px;

    padding:15px 45px;

    border-radius:30px;

    border:2px solid white;

    color:white;

    text-decoration:none;

    transition:.3s;

}


.button:hover{

    background:white;

    color:#006f68;

}



/* スマホ */

@media(max-width:700px){

nav a{

font-size:13px;

margin-right:10px;

}


.content h1{

font-size:50px;

}


.content p{

font-size:18px;

}

}
