<style>

/* =========================
   BASIC
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:white;
    background:#fff;
}


/* =========================
   HEADER
========================= */

header{
    position:fixed;

    top:0;
    right:0;

    width:100%;

    padding:4px 15px;

    z-index:1000;

    display:flex;
    justify-content:flex-end;
    align-items:flex-start;
}


/* =========================
   PC MENU BAR
   メニュー幅だけにする
========================= */

nav{
    width:max-content;
    max-width:calc(100vw - 30px);

    height:58px;

    display:flex;
    align-items:center;
    justify-content:flex-end;

    background:#006F68;

    padding:0;
    margin:0;

    gap:0;

    border-radius:8px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.20);

    overflow:hidden;
}


/* =========================
   MENU LINK
========================= */

nav a{
    height:58px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:6px;

    padding:0 10px;

    color:white;

    text-decoration:none;

    font-size:13px;

    font-weight:bold;

    white-space:nowrap;

    transition:
        background .2s;
}

nav a:hover{
    background:rgba(255,255,255,.14);
}


/* =========================
   ICON
========================= */

.icon{
    width:19px;
    height:19px;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
}

.icon svg{
    width:19px;
    height:19px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.8;

    stroke-linecap:round;
    stroke-linejoin:round;
}


/* =========================
   MOBILE MENU BUTTON
========================= */

.menu-button{
    display:none;

    position:absolute;

    top:4px;
    right:15px;

    width:50px;
    height:50px;

    padding:0;

    border:0;
    border-radius:8px;

    background:#006F68;

    color:white;

    cursor:pointer;

    align-items:center;
    justify-content:center;

    flex-direction:column;

    gap:3px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.20);
}


.hamburger{
    width:21px;
    height:16px;

    display:flex;
    flex-direction:column;
    justify-content:space-between;
}


.hamburger span{
    width:21px;
    height:2px;

    display:block;

    background:white;

    border-radius:2px;

    transition:.25s;
}


.menu-text{
    font-size:8px;
    line-height:8px;

    font-weight:bold;
}


/* =========================
   HAMBURGER ACTIVE
========================= */

.menu-button.active
.hamburger span:nth-child(1){
    transform:
        translateY(7px)
        rotate(45deg);
}

.menu-button.active
.hamburger span:nth-child(2){
    opacity:0;
}

.menu-button.active
.hamburger span:nth-child(3){
    transform:
        translateY(-7px)
        rotate(-45deg);
}


/* =========================
   MOBILE MENU
========================= */

.mobile-menu{
    display:none;

    position:absolute;

    top:62px;
    right:15px;

    width:250px;

    padding:5px;

    background:#006F68;

    border-radius:8px;

    box-shadow:
        0 6px 20px rgba(0,0,0,.25);
}

.mobile-menu.active{
    display:block;
}


.mobile-menu a{
    width:100%;
    min-height:47px;

    padding:11px 14px;

    display:flex;
    align-items:center;

    gap:12px;

    color:white;

    text-decoration:none;

    font-size:14px;
    font-weight:bold;

    border-radius:5px;
}

.mobile-menu a:hover{
    background:rgba(255,255,255,.14);
}


/* =========================
   HERO
========================= */

.hero{
    height:100vh;
    min-height:600px;

    display:flex;

    justify-content:center;
    align-items:center;

    text-align:center;

    position:relative;

    overflow:hidden;
}


/* =========================
   BACKGROUND VIDEO
========================= */

.bg-video{
    position:absolute;

    width:100%;
    height:100%;

    object-fit:cover;

    top:0;
    left:0;

    z-index:-2;
}


/* =========================
   DARK FILTER
========================= */

.hero::before{
    content:"";

    position:absolute;

    width:100%;
    height:100%;

    top:0;
    left:0;

    background:rgba(0,0,0,.45);

    z-index:-1;
}


/* =========================
   CONTENT
========================= */

.content{
    padding:80px 20px 20px;
}


.content h1{
    font-size:80px;

    letter-spacing:10px;
}


.content p{
    font-size:22px;

    margin-top:20px;

    line-height:1.7;
}


/* =========================
   BUTTON
========================= */

.button{
    display:inline-block;

    margin-top:40px;

    padding:15px 45px;

    border-radius:30px;

    border:2px solid white;

    color:white;

    text-decoration:none;

    transition:.3s;
}

.button:hover{
    background:white;

    color:#006f68;
}


/* =========================
   CURRENT DEVELOPMENT WORKS
========================= */

.works-count{
    min-height:500px;

    padding:100px 20px;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    background:white;

    color:#006F68;
}


.works-label{
    font-size:13px;

    letter-spacing:4px;

    font-weight:bold;

    opacity:.65;
}


.works-count h2{
    margin-top:12px;

    font-size:36px;
}


.works-number{
    margin-top:25px;

    display:flex;

    align-items:baseline;
}


#worksCount{
    font-size:100px;

    line-height:1;

    font-weight:800;
}


.works-unit{
    margin-left:8px;

    font-size:25px;

    font-weight:bold;
}


.works-description{
    margin-top:25px;

    color:#555;

    font-size:15px;

    line-height:1.8;
}


/* =========================
   WORK DATA
========================= */

.works-list{
    display:none;
}


/* =========================
   FOOTER
========================= */

footer{
    padding:35px 20px;

    text-align:center;

    background:#006F68;

    color:white;

    font-size:13px;
}


/* =========================
   TABLET
========================= */

@media(max-width:1100px){

    nav a{
        padding:0 7px;
        font-size:11px;
    }

    .icon,
    .icon svg{
        width:17px;
        height:17px;
    }

}


/* =========================
   SMARTPHONE
========================= */

@media(max-width:700px){

    header{
        padding:4px 8px;
    }


    nav{
        display:none;
    }


    .menu-button{
        display:flex;

        right:8px;
    }


    .mobile-menu{
        top:62px;
        right:8px;
    }


    .content{
        padding:80px 15px 20px;
    }


    .content h1{
        font-size:48px;
        letter-spacing:4px;
    }


    .content p{
        font-size:17px;
    }


    .works-count{
        min-height:430px;
        padding:80px 20px;
    }


    .works-count h2{
        font-size:27px;
    }


    #worksCount{
        font-size:75px;
    }


    .works-unit{
        font-size:22px;
    }

}

</style>

<script>

/* =========================
   開発作品数
========================= */

const works =
    document.querySelectorAll("[data-work]");

document.getElementById("worksCount").textContent =
    works.length;


/* =========================
   ハンバーガーメニュー
========================= */

const menuButton =
    document.getElementById("menuButton");

const mobileMenu =
    document.getElementById("mobileMenu");


menuButton.addEventListener(
    "click",
    function(){

        mobileMenu.classList.toggle("active");

        menuButton.classList.toggle("active");

        const isOpen =
            mobileMenu.classList.contains("active");

        menuButton.setAttribute(
            "aria-expanded",
            isOpen
        );

    }
);


/* =========================
   メニューリンクを押したら閉じる
========================= */

mobileMenu
    .querySelectorAll("a")
    .forEach(function(link){

        link.addEventListener(
            "click",
            function(){

                mobileMenu.classList.remove("active");

                menuButton.classList.remove("active");

                menuButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }
        );

    });


/* =========================
   外側をクリックしたら閉じる
========================= */

document.addEventListener(
    "click",
    function(event){

        if(
            !mobileMenu.contains(event.target) &&
            !menuButton.contains(event.target)
        ){

            mobileMenu.classList.remove("active");

            menuButton.classList.remove("active");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);

</script>
