<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 | BINARY</title>

<meta
    name="description"
    content="お探しのページは見つかりませんでした。"
>

<link rel="icon" type="image/png" href="243101166.png">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;

    color:#20202a;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(255,85,145,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(0,200,240,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 20% 90%,
            rgba(255,190,55,.18),
            transparent 28%
        ),
        #fff;

    overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

header{
    position:fixed;

    top:0;
    left:0;

    width:100%;

    height:clamp(60px, 8vh, 78px);

    padding:
        0 clamp(18px, 6vw, 80px);

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:rgba(255,255,255,.8);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:
        1px solid
        rgba(0,0,0,.05);

    z-index:100;
}


.logo{
    text-decoration:none;

    font-size:
        clamp(19px, 2vw, 25px);

    font-weight:1000;

    letter-spacing:-1px;

    background:
        linear-gradient(
            90deg,
            #ff4f91,
            #765cff,
            #00bfe9
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}


.header-label{
    font-size:
        clamp(9px, 1vw, 12px);

    font-weight:900;

    letter-spacing:1px;

    color:#999;
}


/* =========================
   MAIN
========================= */

main{
    width:100%;

    min-height:100vh;
    min-height:100svh;

    display:flex;

    align-items:center;
    justify-content:center;

    position:relative;

    padding:
        calc(
            clamp(60px, 8vh, 78px)
            +
            clamp(25px, 5vh, 60px)
        )
        clamp(15px, 5vw, 60px)
        clamp(70px, 10vh, 110px);

    overflow:hidden;
}


/* =========================
   CONTENT
========================= */

.error-content{
    width:100%;

    max-width:
        clamp(600px, 75vw, 1000px);

    position:relative;

    z-index:2;

    text-align:center;

    animation:
        appear .8s ease both;
}


@keyframes appear{

    from{
        opacity:0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================
   BADGE
========================= */

.badge{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    padding:
        clamp(8px, 1vw, 11px)
        clamp(14px, 2vw, 20px);

    margin-bottom:
        clamp(16px, 3vh, 28px);

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            #fff0f6,
            #f1efff,
            #eafaff
        );

    color:#765cff;

    font-size:
        clamp(10px, 1.2vw, 14px);

    font-weight:1000;

    box-shadow:
        0 8px 30px
        rgba(118,92,255,.08);
}


/* =========================
   404
========================= */

.error-number{
    font-size:
        clamp(
            110px,
            min(28vw, 32vh),
            300px
        );

    line-height:.78;

    font-weight:1000;

    letter-spacing:
        clamp(-14px, -1.2vw, -7px);

    color:#fff;

    -webkit-text-stroke:
        clamp(2px, .35vw, 4px)
        #765cff;

    text-shadow:

        clamp(7px, 1vw, 13px)
        clamp(7px, 1vw, 13px)
        0
        #ff5b99,

        clamp(14px, 2vw, 26px)
        clamp(14px, 2vw, 26px)
        0
        rgba(0,200,240,.32);

    user-select:none;
}


/* =========================
   TITLE
========================= */

.error-title{
    margin-top:
        clamp(30px, 5vh, 60px);

    font-size:
        clamp(23px, 4vw, 48px);

    line-height:1.25;

    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #ff4f91,
            #765cff,
            #00bfe9
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}


/* =========================
   DESCRIPTION
========================= */

.error-description{
    width:100%;

    max-width:650px;

    margin:
        clamp(12px, 2vh, 22px)
        auto 0;

    color:#666;

    font-size:
        clamp(13px, 1.5vw, 17px);

    line-height:1.9;
}


/* =========================
   CURRENT PATH
========================= */

.current-path{
    display:inline-block;

    max-width:90%;

    margin-top:
        clamp(14px, 2vh, 22px);

    padding:8px 14px;

    border-radius:10px;

    background:#f7f7f9;

    color:#999;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:
        clamp(9px, 1vw, 12px);

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================
   BUTTONS
========================= */

.buttons{
    display:flex;

    align-items:center;
    justify-content:center;

    flex-wrap:wrap;

    gap:
        clamp(9px, 1.5vw, 15px);

    margin-top:
        clamp(22px, 4vh, 38px);
}


.button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:
        clamp(170px, 18vw, 220px);

    min-height:
        clamp(46px, 6vh, 58px);

    padding:12px 20px;

    border-radius:999px;

    text-decoration:none;

    font-size:
        clamp(12px, 1.2vw, 15px);

    font-weight:1000;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease,
        color .25s ease;
}


.button:hover{
    transform:
        translateY(-4px)
        scale(1.03);
}


.button.primary{
    color:#fff;

    background:
        linear-gradient(
            90deg,
            #ff4f91,
            #765cff,
            #00bfe9
        );

    box-shadow:
        0 15px 35px
        rgba(118,92,255,.22);
}


.button.secondary{
    color:#555;

    background:#fff;

    border:
        2px solid
        #eee;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.05);
}


.button.secondary:hover{
    color:#765cff;

    border-color:#765cff;
}


/* =========================
   FLOATING SHAPES
========================= */

.shape{
    position:absolute;

    border-radius:50%;

    z-index:0;

    animation:
        float 7s ease-in-out infinite;
}


.shape.one{
    width:
        clamp(80px, 13vw, 190px);

    height:
        clamp(80px, 13vw, 190px);

    left:
        clamp(-30px, 4vw, 70px);

    top:
        clamp(100px, 18vh, 190px);

    background:#ff77aa;

    opacity:.7;
}


.shape.two{
    width:
        clamp(60px, 9vw, 135px);

    height:
        clamp(60px, 9vw, 135px);

    right:
        clamp(-20px, 5vw, 100px);

    top:
        clamp(120px, 25vh, 260px);

    background:#00cbea;

    opacity:.7;

    animation-delay:1s;
}


.shape.three{
    width:
        clamp(70px, 11vw, 155px);

    height:
        clamp(70px, 11vw, 155px);

    left:
        clamp(-20px, 10vw, 170px);

    bottom:
        clamp(30px, 8vh, 100px);

    background:#ffc44d;

    opacity:.7;

    animation-delay:2s;
}


.shape.four{
    width:
        clamp(55px, 7vw, 100px);

    height:
        clamp(55px, 7vw, 100px);

    right:
        clamp(-15px, 12vw, 180px);

    bottom:
        clamp(60px, 15vh, 170px);

    background:#765cff;

    opacity:.65;

    animation-delay:3s;
}


.shape.five{
    width:
        clamp(30px, 4vw, 60px);

    height:
        clamp(30px, 4vw, 60px);

    left:45%;

    top:
        clamp(90px, 14vh, 160px);

    background:#35c98b;

    opacity:.6;

    animation-delay:1.5s;
}


@keyframes float{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(
                clamp(-10px, -2vh, -22px)
            )
            rotate(8deg);
    }

}


/* =========================
   FOOTER
========================= */

footer{
    position:fixed;

    left:0;
    bottom:0;

    width:100%;

    padding:
        clamp(10px, 2vh, 18px)
        20px;

    text-align:center;

    color:#aaa;

    font-size:
        clamp(9px, 1vw, 12px);

    z-index:10;
}


footer strong{
    color:#555;

    font-size:
        clamp(11px, 1.1vw, 14px);
}


/* =========================
   LOW SCREEN
========================= */

@media(
    max-height:700px
)
and
(
    min-width:701px
){

    main{
        padding-top:90px;
        padding-bottom:60px;
    }

    .badge{
        margin-bottom:12px;
    }

    .error-number{
        font-size:
            min(23vw, 190px);
    }

    .error-title{
        margin-top:25px;
    }

    .error-description{
        margin-top:10px;
        line-height:1.6;
    }

    .current-path{
        margin-top:10px;
    }

    .buttons{
        margin-top:18px;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        height:62px;

        padding:0 20px;
    }


    main{
        padding:
            90px 18px 80px;
    }


    .error-number{
        font-size:
            clamp(
                100px,
                31vw,
                190px
            );

        letter-spacing:-9px;

        -webkit-text-stroke:
            2px #765cff;

        text-shadow:
            7px 7px 0 #ff5b99,
            14px 14px 0
            rgba(0,200,240,.3);
    }


    .error-title{
        margin-top:40px;
    }


    .error-description{
        font-size:14px;
        line-height:1.8;
    }


    .buttons{
        flex-direction:column;

        width:100%;
    }


    .button{
        width:100%;

        max-width:330px;
    }

}


/* =========================
   SMALL MOBILE
========================= */

@media(max-width:380px){

    .error-number{
        font-size:100px;
    }

    .error-title{
        font-size:22px;
    }

    .error-description{
        font-size:13px;
    }

    .button{
        min-height:44px;
    }

}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;
    }

}



/* =========================
   ACCESS RECORD NOTICE
   ========================= */
.access-consent{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:14px 20px;
    background:rgba(0,0,0,.92);
    color:#fff;
    box-shadow:0 -3px 15px rgba(0,0,0,.25);
}
.access-consent-text{font-size:12px;line-height:1.6;}
.access-consent button{
    flex-shrink:0;
    padding:9px 24px;
    border:0;
    border-radius:20px;
    background:#fff;
    color:#006F68;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}
.access-consent button:hover{opacity:.85;}
@media(max-width:700px){
    .access-consent{gap:10px;padding:10px 12px;}
    .access-consent-text{font-size:10px;}
    .access-consent button{padding:8px 18px;font-size:12px;}
}

</style>

</head>


<body>


<header>

    <a
        href="index.html"
        class="logo"
    >
        BINARY
    </a>

    <div class="header-label">
        ERROR 404
    </div>

</header>


<main>

    <div class="shape one"></div>

    <div class="shape two"></div>

    <div class="shape three"></div>

    <div class="shape four"></div>

    <div class="shape five"></div>


    <div class="error-content">

        <div class="badge">
            ⚠️ PAGE NOT FOUND
        </div>


        <div class="error-number">
            404
        </div>


        <h1 class="error-title">
            あれ？ページがない！😳
        </h1>


        <p class="error-description">

            お探しのページは、
            移動・削除されたか、
            URLが間違っている可能性があります。

            <br>

            下のボタンから別のページへ移動できます。

        </p>


        <div
            class="current-path"
            id="currentPath"
        >
            ページを確認しています…
        </div>


        <div class="buttons">


            <!-- ホーム -->

            <a
                href="index.html"
                class="button primary"
            >
                🏠 ホームに戻る
            </a>


            <!-- 企画募集 -->

            <a
                href="kikaku.html"
                class="button secondary"
            >
                💡 企画募集
            </a>


            <!-- 前のページ -->

            <a
                href="javascript:history.back()"
                class="button secondary"
                id="backButton"
            >
                ← 前のページへ
            </a>


        </div>

    </div>

</main>


<footer>

    <strong>
        BINARY
    </strong>

    <br>

    © BINARY / るあ

</footer>


<script>

/* =========================
   現在のURL
========================= */

const path =
    document.getElementById("currentPath");

if(path){

    const current =
        window.location.pathname;

    path.textContent =
        current || "/";
}


/* =========================
   戻るボタン
========================= */

const backButton =
    document.getElementById("backButton");

if(backButton){

    if(
        document.referrer === "" ||
        window.history.length <= 1
    ){

        backButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                window.location.href =
                    "index.html";

            }
        );

    }

}

</script>



<!-- ACCESS RECORD NOTICE -->
<div class="access-consent" id="accessConsent">
    <div class="access-consent-text">
        このサイトでは、アクセス日時・ページURL・端末・OS・ブラウザ等のアクセス情報を記録しています。
    </div>
    <button type="button" id="accessConsentButton" aria-label="アクセス記録のお知らせを閉じる">OK</button>
</div>


<script>
/* =========================
   ACCESS RECORD + NOTICE
   ========================= */
(function(){
    const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSccfR4g1Ytnzr0aLv31R3NkjUWRmaaD6YwQnjNYF0d60Uexmg/formResponse";

    function getDevice(){
        const w=window.innerWidth;
        if(w<=700) return "スマートフォン";
        if(w<=1100) return "タブレット";
        return "PC";
    }
    function getOS(){
        const ua=navigator.userAgent;
        if(/Android/i.test(ua)) return "Android";
        if(/iPhone|iPad|iPod/i.test(ua)) return "iOS / iPadOS";
        if(/Windows/i.test(ua)) return "Windows";
        if(/Mac OS X/i.test(ua)) return "macOS";
        if(/CrOS/i.test(ua)) return "ChromeOS";
        if(/Linux/i.test(ua)) return "Linux";
        return "その他 / 不明";
    }
    function getBrowser(){
        const ua=navigator.userAgent;
        if(/Edg\//i.test(ua)) return "Microsoft Edge";
        if(/OPR\//i.test(ua)) return "Opera";
        if(/Chrome\//i.test(ua) && !/Edg\//i.test(ua)) return "Google Chrome";
        if(/Firefox\//i.test(ua)) return "Firefox";
        if(/Safari\//i.test(ua) && !/Chrome\//i.test(ua)) return "Safari";
        return "その他 / 不明";
    }

    function sendAccessLog(){
        const now=new Date();
        const params=new URLSearchParams();
        params.set("entry.1390942320", now.toLocaleString("ja-JP", {timeZone:"Asia/Tokyo"}));
        params.set("entry.600562719", location.href);
        params.set("entry.32786128", document.title);
        params.set("entry.318452337", getDevice());
        params.set("entry.1152326462", getOS());
        params.set("entry.777710718", getBrowser());

        // Hidden iframe + form submit: Google Formsの送信を確実に行う
        const iframe=document.createElement("iframe");
        iframe.name="accessLogFrame_"+Date.now();
        iframe.style.display="none";
        document.body.appendChild(iframe);

        const form=document.createElement("form");
        form.method="GET";
        form.action=FORM_URL;
        form.target=iframe.name;
        form.style.display="none";

        params.forEach((value,key)=>{
            const input=document.createElement("input");
            input.type="hidden";
            input.name=key;
            input.value=value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
    }

    function setupNotice(){
        const notice=document.getElementById("accessConsent");
        const button=document.getElementById("accessConsentButton");
        if(!notice || !button) return;
        button.addEventListener("click", function(e){
            e.preventDefault();
            e.stopPropagation();
            notice.remove();
            try{ sessionStorage.setItem("accessNoticeAccepted","1"); }catch(e){}
        });
        try{
            if(sessionStorage.getItem("accessNoticeAccepted")==="1") notice.remove();
        }catch(e){}
    }

    function start(){
        setupNotice();
        sendAccessLog();
    }
    if(document.readyState==="loading"){
        document.addEventListener("DOMContentLoaded", start, {once:true});
    }else{
        start();
    }
})();
</script>

</body>

</html>
