<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>404 | BINARY</title>

<meta
    name="description"
    content="お探しのページは見つかりませんでした。"
/>

<link
    rel="icon"
    type="image/png"
    href="243101166.png"
>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;

    color:#20202a;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(255,85,145,.18),
            transparent 28%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(0,200,240,.18),
            transparent 28%
        ),

        radial-gradient(
            circle at 20% 90%,
            rgba(255,190,55,.18),
            transparent 28%
        ),

        #ffffff;

    overflow:hidden;
}


/* =========================
   HEADER
========================= */

header{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:74px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 6%;

    background:
        rgba(255,255,255,.78);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(0,0,0,.05);

    z-index:100;
}

.logo{
    text-decoration:none;

    font-size:23px;

    font-weight:1000;

    letter-spacing:-1px;

    background:
        linear-gradient(
            90deg,
            #ff4f91,
            #765cff,
            #00bfe9
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.header-label{
    font-size:12px;

    font-weight:900;

    letter-spacing:1px;

    color:#999;
}


/* =========================
   MAIN
========================= */

main{
    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    padding:
        100px 20px 60px;

    text-align:center;

    overflow:hidden;
}


/* =========================
   FLOATING SHAPES
========================= */

.shape{
    position:absolute;

    border-radius:50%;

    z-index:0;

    animation:
        float 7s
        ease-in-out
        infinite;
}

.shape.one{
    width:190px;
    height:190px;

    left:5%;
    top:17%;

    background:#ff77aa;

    opacity:.75;
}

.shape.two{
    width:130px;
    height:130px;

    right:8%;
    top:25%;

    background:#00cbea;

    opacity:.7;

    animation-delay:1s;
}

.shape.three{
    width:150px;
    height:150px;

    left:13%;
    bottom:5%;

    background:#ffc44d;

    opacity:.7;

    animation-delay:2s;
}

.shape.four{
    width:95px;
    height:95px;

    right:14%;
    bottom:14%;

    background:#765cff;

    opacity:.65;

    animation-delay:3s;
}

.shape.five{
    width:55px;
    height:55px;

    left:45%;
    top:16%;

    background:#35c98b;

    opacity:.65;

    animation-delay:1.5s;
}

@keyframes float{

    0%,
    100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-22px)
            rotate(8deg);
    }
}


/* =========================
   CONTENT
========================= */

.error-content{
    position:relative;

    z-index:2;

    width:100%;

    max-width:900px;

    animation:
        appear .8s
        ease both;
}

@keyframes appear{

    from{
        opacity:0;

        transform:
            translateY(25px)
            scale(.97);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================
   BADGE
========================= */

.badge{
    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        10px 18px;

    margin-bottom:25px;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            #fff0f6,
            #f1efff,
            #eafaff
        );

    color:#765cff;

    font-size:13px;

    font-weight:1000;

    box-shadow:
        0 8px 30px
        rgba(118,92,255,.08);
}


/* =========================
   404
========================= */

.error-number{
    font-size:
        clamp(
            130px,
            25vw,
            290px
        );

    line-height:.78;

    font-weight:1000;

    letter-spacing:-18px;

    color:#fff;

    -webkit-text-stroke:
        4px #765cff;

    text-shadow:
        12px 12px 0 #ff5b99,
        24px 24px 0 rgba(0,200,240,.32);

    user-select:none;
}


/* =========================
   TEXT
========================= */

.error-title{
    margin-top:55px;

    font-size:
        clamp(
            25px,
            5vw,
            48px
        );

    font-weight:1000;

    background:
        linear-gradient(
            90deg,
            #ff4f91,
            #765cff,
            #00bfe9
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.error-description{
    margin:
        18px auto 0;

    max-width:620px;

    color:#666;

    font-size:16px;

    line-height:1.9;
}


/* =========================
   PATH
========================= */

.current-path{
    display:inline-block;

    max-width:90%;

    margin-top:20px;

    padding:
        9px 15px;

    border-radius:10px;

    background:#f7f7f9;

    color:#999;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size:12px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}


/* =========================
   BUTTONS
========================= */

.buttons{
    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:14px;

    margin-top:35px;
}

.button{
    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-width:205px;

    padding:
        16px 25px;

    border-radius:999px;

    text-decoration:none;

    font-size:15px;

    font-weight:1000;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.button:hover{
    transform:
        translateY(-4px)
        scale(1.03);
}

.button.primary{
    color:#fff;

    background:
        linear-gradient(
            90deg,
            #ff4f91,
            #765cff,
            #00bfe9
        );

    box-shadow:
        0 15px 35px
        rgba(118,92,255,.22);
}

.button.primary:hover{
    box-shadow:
        0 20px 45px
        rgba(118,92,255,.3);
}

.button.secondary{
    color:#555;

    background:#fff;

    border:
        2px solid
        #eeeeee;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.05);
}

.button.secondary:hover{
    border-color:#765cff;

    color:#765cff;
}


/* =========================
   FOOTER
========================= */

footer{
    position:fixed;

    left:0;
    bottom:0;

    width:100%;

    padding:
        18px 20px;

    text-align:center;

    color:#aaa;

    font-size:12px;

    z-index:10;
}

footer strong{
    color:#555;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        height:62px;

        padding:
            0 20px;
    }

    .header-label{
        font-size:10px;
    }

    main{
        padding:
            90px 18px 70px;
    }

    .error-number{
        font-size:
            clamp(
                105px,
                32vw,
                190px
            );

        letter-spacing:-9px;

        -webkit-text-stroke:
            2px #765cff;

        text-shadow:
            7px 7px 0 #ff5b99,
            14px 14px 0 rgba(0,200,240,.3);
    }

    .error-title{
        margin-top:42px;
    }

    .error-description{
        font-size:14px;
    }

    .buttons{
        flex-direction:column;

        width:100%;
    }

    .button{
        width:100%;

        max-width:320px;
    }

    .shape.one{
        width:100px;
        height:100px;

        left:-20px;
    }

    .shape.two{
        width:75px;
        height:75px;

        right:-15px;
    }

    .shape.three{
        width:90px;
        height:90px;

        left:-15px;
    }

    .shape.four{
        width:65px;
        height:65px;

        right:-10px;
    }

    .shape.five{
        width:40px;
        height:40px;
    }

}


/* =========================
   REDUCED MOTION
========================= */

@media(
    prefers-reduced-motion:reduce
){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;

        animation-iteration-count:1 !important;

        scroll-behavior:auto !important;
    }
}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <a
        href="/"
        class="logo"
    >
        BINARY
    </a>

    <div class="header-label">
        ERROR 404
    </div>

</header>


<!-- MAIN -->

<main>


    <!-- FLOATING SHAPES -->

    <div class="shape one"></div>

    <div class="shape two"></div>

    <div class="shape three"></div>

    <div class="shape four"></div>

    <div class="shape five"></div>


    <!-- ERROR CONTENT -->

    <div class="error-content">


        <div class="badge">
            ⚠️ PAGE NOT FOUND
        </div>


        <div class="error-number">
            404
        </div>


        <h1 class="error-title">
            あれ？ページがない！😳
        </h1>


        <p class="error-description">

            お探しのページは、
            移動・削除されたか、
            URLが間違っている可能性があります。

            <br>

            もう一度確認するか、
            下のボタンから移動してください。

        </p>


        <div
            class="current-path"
            id="currentPath"
        >
            ページを確認しています…
        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <a
                href="/"
                class="button primary"
            >
                🏠 ホームに戻る
            </a>


            <a
                href="javascript:history.back()"
                class="button secondary"
            >
                ← 前のページへ
            </a>

        </div>

    </div>

</main>


<!-- FOOTER -->

<footer>

    <strong>
        BINARY
    </strong>

    <br>

    © BINARY / るあ

</footer>


<script>

/* 現在のURLを表示 */

const path =
    document.getElementById("currentPath");

if(path){

    const current =
        window.location.pathname;

    path.textContent =
        current || "/";
}


/* 履歴がない場合は
   前のページボタンを無効化 */

const backButton =
    document.querySelector(
        'a[href="javascript:history.back()"]'
    );

if(backButton){

    if(
        document.referrer === "" ||
        window.history.length <= 1
    ){

        backButton.style.opacity = ".5";

        backButton.addEventListener(
            "click",
            function(event){

                event.preventDefault();

                window.location.href = "/";

            }
        );

    }

}

</script>


</body>

</html>
