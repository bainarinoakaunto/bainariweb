<body>

<main>


<div class="title">
STATUS
</div>


<div class="description">
BAINARI関連サービスの稼働状況
</div>



<div class="meta">

<div id="system">
Loading...
</div>


<div>
現在時刻：
<span id="clock">
--:--:--
</span>
</div>


<div>
Last Sync：
<span id="sync">
--
</span>
</div>


</div>




<div class="status-box">

<div class="status-top">

<div class="name">
ブログ（ryo15542.blog.jp）
</div>

<div id="blogStatus" class="status">
Loading...
</div>

</div>

</div>




<div class="status-box">

<div class="status-top">

<div class="name">
ryoチューブ
</div>

<div id="tubeStatus" class="status">
Loading...
</div>

</div>

</div>




<div class="status-box">

<div class="status-top">

<div class="name">
ryoタイマー
</div>

<div id="timerStatus" class="status">
Loading...
</div>

</div>

</div>




<div class="status-box">

<div class="status-top">

<div class="name">
何でもプロジェクト各種サポートサービス
</div>

<div id="projectStatus" class="status">

</div>

<footer>

© BAINARI

</footer>




<script>


const url =
"https://bainarinoakaunto.github.io/bainariweb/kadou.json";



// 現在時刻

function updateClock(){

const now=new Date();


const h=String(now.getHours()).padStart(2,"0");

const m=String(now.getMinutes()).padStart(2,"0");

const s=String(now.getSeconds()).padStart(2,"0");


document.getElementById("clock").innerText =
`${h}:${m}:${s}`;

}


updateClock();

setInterval(updateClock,1000);




// 稼働情報取得

function formatTime(){

const now=new Date();

return now.toLocaleTimeString("ja-JP");

}



async function load(){


try{


const res =
await fetch(url+"?t="+Date.now());


const data =
await res.json();



document.getElementById("system").innerText =
data.system || "All Systems Operational";



if(data.blog){

document.getElementById("blogStatus").innerText =
data.blog.status;

}


if(data.tube){

document.getElementById("tubeStatus").innerText =
data.tube.status;

}


if(data.timer){

document.getElementById("timerStatus").innerText =
data.timer.status;

}


if(data.project){

document.getElementById("projectStatus").innerText =
data.project.status;

}



document.getElementById("sync").innerText =
formatTime();



}catch(e){

console.log(e);

}


}



load();

setInterval(load,5000);


</script>
